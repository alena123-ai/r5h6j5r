name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle project structure
      run: |
        mkdir -p app/src/main/java/com/example/calculator
        mkdir -p gradle/wrapper

        # Копируем исходники из корня в структуру проекта
        cp MainActivity.java app/src/main/java/com/example/calculator/MainActivity.java
        cp AndroidManifest.xml app/src/main/AndroidManifest.xml

        # Корневой build.gradle
        cat > build.gradle <<'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
            }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # app/build.gradle
        cat > app/build.gradle <<'EOF'
        plugins { id 'com.android.application' }
        android {
            namespace 'com.example.calculator'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.calculator"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        EOF

        # settings.gradle
        cat > settings.gradle <<'EOF'
        rootProject.name = "MyCalculator"
        include ':app'
        EOF

        # gradle.properties
        cat > gradle.properties <<'EOF'
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        # wrapper properties — фиксируем Gradle 8.2
        cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

    - name: Download gradlew script
      run: |
        curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: app/build/outputs/apk/debug/app-debug.apk
